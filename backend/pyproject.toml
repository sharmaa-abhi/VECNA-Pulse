[project]
name = "vecna-pulse-backend"
version = "3.0.0"
description = "VECNA-Pulse Real-Time Speech Emotion Recognition (SER) & Cybercrime Call Triage API"
readme = "README.md"
authors = [
    { name = "Abhishek Sharma & Team VoidRiders" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "librosa>=0.10.0",
    "numpy>=1.26.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    "scipy>=1.14.0",
    "sherpa-onnx>=1.10.0",
    "soundfile>=0.12.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=13.0",
]

[project.scripts]
vecna-pulse = "app.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning"
]
